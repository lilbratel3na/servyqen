<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />

  <meta name="theme-color" content="#05070d" />
  <title>Agent Service Layer</title>
  <style>
    /* Paint the document shell in the app background BEFORE React mounts.

       heavy mobile repaint exposes the browser's default white canvas —
       observed on-device as a brief full-white flash. */

      background: #05070d;
      color-scheme: dark;
    }
  </style>
</head>
